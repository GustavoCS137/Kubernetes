apiVersion: apps/v1
kind: Deployment
metadata:
  name: meu-site
  labels:
    app: meu-site
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meu-site
  template:
    metadata:
      labels:
        app: meu-site
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: meu-site
  labels:
    app: meu-site
spec:
  type: NodePort
  selector:
    app: meu-site
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
